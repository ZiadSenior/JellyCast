name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Ensure Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Prepare Environment & Keystore
        run: |
          # Ensure .env exists for the Secrets Gradle Plugin
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

          # Decode or generate debug keystore for signing
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        env:
          JAVA_OPTS: "-Djava.awt.headless=true"
          ORG_GRADLE_PROJECT_android.nonTransitiveRClass: "true"
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/JellyCast.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: JellyCast-APK
          path: build-artifacts/JellyCast.apk
          retention-days: 14

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            TITLE="JellyCast ${TAG}"
          else
            TAG="v1.2"
            TITLE="JellyCast v1.2"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT

      - name: Clean Up Legacy Release Assets
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ steps.release_info.outputs.tag }}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            for asset in $(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | select(.name != "JellyCast.apk") | .name'); do
              echo "Removing outdated release asset: $asset"
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes || true
            done
          fi

      - name: Update Release Tag to Latest Commit
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          RELEASE_TAG="${{ steps.release_info.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$RELEASE_TAG" ${{ github.sha }}
          git push -f origin "$RELEASE_TAG"

      - name: Publish Direct APK to GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_info.outputs.title }}
          body: |
            ## JellyCast v1.2

            ### Direct APK Download
            Download **`JellyCast.apk`** below directly to your phone or tablet.

            ### What's New in v1.2
            - **Buttery-Smooth UI**: Decoupled playback state flow, eliminated background frame animations, and enabled lightweight bitmap caching for 60/120 FPS scrolling.
            - **Audio Transcoding Options**: Real-time transcoding to AAC 2.0 Stereo or MP3 Stereo for DLNA TVs lacking AC3/DTS audio decoding.
            - **Subtitle Burn-In**: Built-in option to have Jellyfin transcode and burn selected subtitles directly into video streams for DLNA renderers.
            - **Full Series & Seasons Navigation**: Complete TV show hierarchy (Shows -> Seasons -> Episodes) with instant playback and poster art.
            - **Stream Settings Dialog**: Live audio track and subtitle switcher during playback in the remote control.
          files: build-artifacts/JellyCast.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


