name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Ensure Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Prepare Environment & Keystore
        run: |
          # Ensure .env exists for the Secrets Gradle Plugin
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

          # Decode or generate debug keystore for signing
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        env:
          JAVA_OPTS: "-Djava.awt.headless=true"
          ORG_GRADLE_PROJECT_android.nonTransitiveRClass: "true"
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Extract Version & Determine Release Info
        id: release_info
        run: |
          # Extract version from app/build.gradle.kts
          APP_VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION="1.4"
          fi
          APK_NAME="JellyCast-${APP_VERSION}.apk"
          echo "version=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            TITLE="JellyCast ${TAG}"
          else
            TAG="v${APP_VERSION}"
            TITLE="JellyCast v${APP_VERSION}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT

      - name: Prepare APK Output
        run: |
          mkdir -p build-artifacts
          APK_NAME="${{ steps.release_info.outputs.apk_name }}"
          cp app/build/outputs/apk/debug/app-debug.apk "build-artifacts/${APK_NAME}"
          echo "Prepared release artifact: build-artifacts/${APK_NAME}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: JellyCast-${{ steps.release_info.outputs.version }}-APK
          path: build-artifacts/${{ steps.release_info.outputs.apk_name }}
          retention-days: 14

      - name: Clean Up Legacy Release Assets
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ steps.release_info.outputs.tag }}"
          CURRENT_APK="${{ steps.release_info.outputs.apk_name }}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            for asset in $(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name'); do
              if [ "$asset" != "$CURRENT_APK" ]; then
                echo "Removing outdated release asset: $asset"
                gh release delete-asset "$RELEASE_TAG" "$asset" --yes || true
              fi
            done
          fi

      - name: Update Release Tag to Latest Commit
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          RELEASE_TAG="${{ steps.release_info.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$RELEASE_TAG" ${{ github.sha }}
          git push -f origin "$RELEASE_TAG"

      - name: Publish Direct APK to GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_info.outputs.title }}
          draft: false
          prerelease: false
          make_latest: "true"
          body: |
            ## JellyCast v${{ steps.release_info.outputs.version }}

            ### Direct APK Download
            Download **`${{ steps.release_info.outputs.apk_name }}`** below directly to your device or update via Obtanium.

            ### What's New in v${{ steps.release_info.outputs.version }}
            - **Audio Transcoding Fixed**: Resolved "unsupported format" errors and muted audio by fixing stream-copy syntax and downmixing to high-quality 2-channel 256k AAC.
            - **AAC (MPEG-TS) Mode**: Added `.ts` streaming container to overcome receiver and TV limitations with live progressive MP4 containers.
            - **Audio Track Selector**: Live audio track selection in remote control and media detail views with proper `MediaSourceId` integration, enabling alternate languages, director commentary, and surround tracks to transcode with clean audio.
            - **Position Preserving Stream Switching**: Switching audio tracks or transcode profiles automatically resumes playback at the exact timestamp.
            - **One-Tap Server Auto-Discovery**: Automatically discovers Jellyfin servers on the local network via UDP (port 7359) and subnet scan.
            - **Dynamic Versioned APK Naming**: From v1.4 onwards, releases include `JellyCast-<version>.apk` (e.g. `${{ steps.release_info.outputs.apk_name }}`).

            *For the complete changelog of all versions, see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).*
          files: build-artifacts/${{ steps.release_info.outputs.apk_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


